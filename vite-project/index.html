<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>vite-project</title>
  </head>
  <body>
    <h1>Pokemon!</h1>
    <form id="form">
      <h2>Capture Pokemon</h2>
      <div>
        <label for="name">Name</label>
        <input type="text" name="name" id="name" required>
      </div>
      <div>
        <label for="types">Types</label>
        <input type="text" name="types" id="types" required>
      </div>
      <div>
        <label for="favorite">Is Favorite</label>
        <input type="checkbox" name="favorite" id="favorite">
      </div>
      <button type="submit">Capture</button>
    </form>
    <h2>Discovered Pokemon</h2>
    <button id="discover-button">Find More Pokemon</button>
    <p id="error"></p>
    <p id="success"></p>
    <ul id="discovered-list"></ul>
    <h2>Search a Pokemon</h2>
    <div>
      <label for="pokemon-input">Enter a Pokemon ID or Name</label>
      <input type="text" id="pokemon-input" name="pokemon">
    </div>
    <button id="poke-button">Submit</button>
    <div id="pokemon"></div>
    <script type="module" src="src/main.js"></script>
    <script type="module" src="src/dom-helpers.js"></script>
  </body>
</html>
